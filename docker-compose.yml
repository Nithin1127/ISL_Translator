version: '3.8'
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_ORIGIN=http://localhost:3000
    depends_on:
      - ai-service
  ai-service:
    image: python:3.12-slim
    working_dir: /app/ai-service
    volumes:
      - .:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
